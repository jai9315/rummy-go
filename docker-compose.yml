version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      # JWT_SECRET must be set in .env — no fallback allowed (security)
      - CLIENT_URL=http://localhost:3000
      # LiveKit credentials must be set in .env — no demo fallbacks
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL}
    volumes:
      - db-data:/app/prisma
    restart: always

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER_URL=http://localhost:4000
    depends_on:
      - server
    restart: always

volumes:
  db-data: