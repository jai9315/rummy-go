version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=production_super_secret_jwt_key_2026_rummy
      - CLIENT_URL=http://localhost:3000
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://demo.livekit.cloud}
    volumes:
      - db-data:/app/prisma
    restart: always

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER_URL=http://localhost:4000
    depends_on:
      - server
    restart: always

volumes:
  db-data:
